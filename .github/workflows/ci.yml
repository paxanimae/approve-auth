name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    name: go build / vet / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # web/admin/dist is gitignored (a build artifact); internal/httpserver
      # go:embeds it as the served admin console, so it must exist before
      # go vet/build/lint even parses that package.
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
      - working-directory: web/admin
        run: npm ci && npm run build
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - run: go build ./...

  go-test:
    name: go test (with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: approve_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d approve_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A superuser-capable connection string: internal/store's tests run
      # migrations (including creating the approve_auth_app /
      # approve_auth_maintenance login roles) before connecting as
      # those specific roles to exercise the audit-immutability grants.
      TEST_DATABASE_URL: postgres://postgres:devpassword@localhost:5432/approve_auth?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # See the go job above: web/admin/dist must exist before anything
      # imports web/admin (its go:embed target).
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
      - working-directory: web/admin
        run: npm ci && npm run build
      # internal/store's own TestMain migrates the schema itself, but
      # that only runs when internal/store's tests run -- every other
      # package (internal/admin, internal/adminsession, ...) assumes
      # the schema already exists and has no migration step of its own.
      # `go test ./...` doesn't guarantee internal/store runs first, so
      # without this, whichever package Go happens to run before it
      # fails with "relation ... does not exist" against a freshly
      # created, unmigrated database -- exactly what a real deployment's
      # own one-shot `admin migrate-up` (deploy/stack.yml's `migrate`
      # service) always runs before anything else touches the schema.
      - name: Run database migrations
        run: |
          echo "$TEST_DATABASE_URL" > /tmp/database_url
          DATABASE_URL_FILE=/tmp/database_url go run ./cmd/admin migrate-up
      # -p 1: internal/store's tests drop and recreate the whole schema
      # mid-run, which races against other packages' DB tests if Go runs
      # package test binaries concurrently (see scripts/dev.sh).
      - run: go test ./... -race -p 1

  traefik-integration:
    name: real-Traefik integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: scripts/gen-certs.sh
      - run: scripts/gen-mtls-certs.sh
      - run: |
          docker compose -f deploy/dev/docker-compose.yml up -d --build \
            migrate approve-auth backend-protected traefik
      - name: Wait for Traefik's edge to accept connections
        run: |
          for i in $(seq 1 30); do
            curl -sk --max-time 2 https://127.0.0.1:18443/ -o /dev/null && exit 0
            sleep 1
          done
          echo "Traefik never became reachable" >&2
          exit 1
      - env:
          TEST_DATABASE_URL: postgres://postgres:devpassword@localhost:5432/approve_auth?sslmode=disable
          TRAEFIK_ADDR: 127.0.0.1:18443
        run: go test ./tests/integration/... -race -v
      - if: always()
        run: docker compose -f deploy/dev/docker-compose.yml logs

  web:
    name: web/admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
      - run: npm ci
      - run: npm run check
      - run: npm run build

  helm:
    name: helm lint / template (approve-auth chart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - run: helm lint --strict deploy/helm/approve-auth -f deploy/helm/approve-auth/ci/test-values.yaml
      # ci/test-values.yaml supplies every `required` value with a
      # placeholder (see that file's own comment) purely so this
      # renders at all -- this only proves the templates are valid
      # Kubernetes YAML, not that a real install against a live
      # cluster succeeds (no cluster in this job).
      - run: helm template approve-auth deploy/helm/approve-auth -f deploy/helm/approve-auth/ci/test-values.yaml | tee /tmp/rendered.yaml
      - name: kubeconform (schema-validate every rendered resource)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # Traefik's own CRDs (Middleware/IngressRoute) aren't in any
          # public OpenAPI schema registry -- skip schema validation for
          # those two kinds specifically rather than skipping the whole
          # job; every core Kubernetes kind this chart renders (Job,
          # Deployment, StatefulSet, Service, ConfigMap,
          # ServiceAccount) is still fully checked.
          ./kubeconform -strict -summary \
            -skip Middleware,IngressRoute \
            -schema-location default \
            /tmp/rendered.yaml
