name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    name: go build / vet / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # web/admin/dist is gitignored (a build artifact); internal/httpserver
      # go:embeds it as the served admin console, so it must exist before
      # go vet/build/lint even parses that package.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - working-directory: web/admin
        run: npm ci && npm run build
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - run: go build ./...

  go-test:
    name: go test (with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: manual_approval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manual_approval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A superuser-capable connection string: internal/store's tests run
      # migrations (including creating the manual_approval_app /
      # manual_approval_maintenance login roles) before connecting as
      # those specific roles to exercise the audit-immutability grants.
      TEST_DATABASE_URL: postgres://postgres:devpassword@localhost:5432/manual_approval?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # See the go job above: web/admin/dist must exist before anything
      # imports web/admin (its go:embed target).
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - working-directory: web/admin
        run: npm ci && npm run build
      # -p 1: internal/store's tests drop and recreate the whole schema
      # mid-run, which races against other packages' DB tests if Go runs
      # package test binaries concurrently (see scripts/dev.sh).
      - run: go test ./... -race -p 1

  traefik-integration:
    name: real-Traefik integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/gen-certs.sh
      - run: scripts/gen-mtls-certs.sh
      - run: |
          docker compose -f deploy/dev/docker-compose.yml up -d --build \
            migrate manual-approval backend-protected traefik
      - name: Wait for Traefik's edge to accept connections
        run: |
          for i in $(seq 1 30); do
            curl -sk --max-time 2 https://127.0.0.1:18443/ -o /dev/null && exit 0
            sleep 1
          done
          echo "Traefik never became reachable" >&2
          exit 1
      - env:
          TEST_DATABASE_URL: postgres://postgres:devpassword@localhost:5432/manual_approval?sslmode=disable
          TRAEFIK_ADDR: 127.0.0.1:18443
        run: go test ./tests/integration/... -race -v
      - if: always()
        run: docker compose -f deploy/dev/docker-compose.yml logs

  web:
    name: web/admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - run: npm ci
      - run: npm run check
      - run: npm run build
