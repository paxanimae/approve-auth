# Production Docker Swarm deployment for this service only (spec section
# 13). Deploy with:
#
#   docker stack deploy -c deploy/stack.yml approve-auth
#
# This stack does NOT bundle Traefik: spec section 6's own examples
# assume Traefik already exists as shared cluster ingress that each
# application attaches to via `deploy.labels`, not something every
# service redeploys for itself. See docs/runbooks/rollout-rollback.md for
# what the already-deployed Traefik still needs from this service
# (deploy/traefik-approve-auth-middleware.yml, mounted into Traefik's
# own file-provider directory) and what this stack's own `labels:` below
# register directly (the admin listener's router).
#
# Prerequisites -- see docs/runbooks/rollout-rollback.md for the full
# walkthrough:
#   - Build and push the image, then export APPROVE_AUTH_IMAGE as a
#     real, digest-pinned reference before running `docker stack deploy`
#     (Swarm reads this from the invoking shell's environment, not a
#     .env file, unless you export it yourself first).
#   - Export ADMIN_HOSTNAME (the real admin console hostname) and,
#     if you're not using a resolver literally named "default",
#     TRAEFIK_CERT_RESOLVER.
#   - Make sure the shared ingress network Traefik itself is attached
#     to actually exists (the `control-plane` network below is
#     `external: true` -- this stack does not create it) and export
#     TRAEFIK_NETWORK to its real name if it isn't
#     "approve-control-plane":
#       docker network create --driver overlay --attachable approve-control-plane
#       docker service update --network-add approve-control-plane <your-traefik-service-name>
#     (skip both if Traefik's own stack already defines and publishes
#     this network under a name you can just point TRAEFIK_NETWORK at,
#     e.g. the common "traefik_public" convention).
#   - Create every secret listed under `secrets:` with `docker secret
#     create` -- see the runbook for the full list and what each holds.
#   - Copy deploy/approve-auth-config.example.yaml to a real config
#     file with real values, then load it as the approve-auth-config
#     Swarm config (see the `configs:` section below for the exact
#     command / Portainer steps).
#   - Label at least one storage-capable node
#     `approve-auth-db-storage=true`
#     (docker node update --label-add approve-auth-db-storage=true <node>).
#     The default `local` volume below does NOT survive node loss or
#     follow rescheduling -- replace it with a real network/cloud volume
#     driver for anything beyond a single pinned node (spec section 13
#     is explicit that a single-node Postgres is a deliberate, documented
#     single point of failure, not something to paper over here).
#
# Running the admin listener with admin_auth_mode: anonymous (some
# other mechanism -- a VPN, an upstream SSO reverse proxy, network
# ACLs -- gates who reaches it instead of this service's own OIDC
# login; see deploy/approve-auth-config.example.yaml): the
# oidc_client_secret and oidc_state_key secrets below are still
# required to exist (Swarm refuses to deploy a service referencing a
# secret that was never created), but their *values* are never read in
# that mode, so any placeholder works, e.g.:
#   printf 'unused-in-anonymous-mode' | docker secret create oidc_client_secret -
#   openssl rand -base64 32 | docker secret create oidc_state_key -
# (oidc_state_key still needs to decode as a 32-byte key even though
# it's unused, since config loading validates its shape unconditionally.)

services:
  db:
    image: postgres:17.6
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.approve-auth-db-storage == true
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_DB: approve_auth
      POSTGRES_USER_FILE: /run/secrets/db_superuser_name
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
    secrets:
      - db_superuser_name
      - db_superuser_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/db_superuser_name)\" -d approve_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off, locked migration step (spec section 13) -- run to
  # completion before approve-auth starts, never on every replica.
  # `restart_policy: condition: none` means Swarm does not retry or keep
  # this task around after it exits; re-deploy the stack to run it again
  # (e.g. after a schema change), which is also how a rolling upgrade
  # that needs a new migration is expected to apply it.
  migrate:
    image: ${APPROVE_AUTH_IMAGE:?set APPROVE_AUTH_IMAGE to a real, digest-pinned image reference}
    entrypoint: ["/usr/local/bin/admin", "migrate-up"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url_superuser
    secrets:
      - database_url_superuser
    networks:
      - db
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  approve-auth:
    image: ${APPROVE_AUTH_IMAGE:?set APPROVE_AUTH_IMAGE to a real, digest-pinned image reference}
    # Hardening spec section 13 requires: nonroot (already the image's
    # default user, restated here for auditability), read-only root
    # filesystem with a writable tmpfs only where something needs it,
    # and every Linux capability dropped.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      CONFIG_FILE: /config/approve-auth.yaml
      DATABASE_URL_FILE: /run/secrets/database_url
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      CLAIM_ENCRYPTION_KEY_FILE: /run/secrets/claim_encryption_key
      OIDC_STATE_ENCRYPTION_KEY_FILE: /run/secrets/oidc_state_key
    secrets:
      - database_url
      - oidc_client_secret
      - claim_encryption_key
      - oidc_state_key
      - auth_tls_cert
      - auth_tls_key
      - auth_client_ca
    configs:
      - source: approve-auth-config
        target: /config/approve-auth.yaml
    networks:
      - control-plane # Traefik reaches the admin listener and, over
                       # mTLS, calls /auth here (spec section 13's
                       # "restricted overlay shared by Traefik and this
                       # service")
      - db             # the service's own least-privilege runtime role
      - ops             # a separately-deployed monitoring stack scrapes
                       # GET /metrics (:9090) via this network
    deploy:
      # "Deploy two authorization-service replicas with separate-node
      # placement where capacity allows" (spec section 13).
      replicas: 2
      placement:
        max_replicas_per_node: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: on-failure
      resources:
        # Spec section 15's load-testing baseline assumes "two app
        # replicas provisioned at 2 vCPU/512 MiB each" -- these limits
        # match that; adjust after your own load test, not before.
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
      labels:
        # Traefik's Swarm provider discovers this service because it's
        # attached to the same control-plane overlay -- spec section 6's
        # own example labels, scoped to the admin listener only.
        # Protected-application hostnames are registered by whichever
        # stack deploys that application, pointing its own
        # `approve-auth@file` middleware reference at the file-
        # provider snippet below; this service's own labels never define
        # a protected-application router (it doesn't know their hostnames).
        - traefik.enable=true
        # approve-auth is on three networks (control-plane, db, ops)
        # and Traefik is only on control-plane -- without this,
        # Traefik's Swarm provider has to guess which one to route
        # through, and can pick wrong (or fail) the moment there's more
        # than one candidate. traefik.docker.network was the label for
        # this before Traefik v3.2.2; traefik.swarm.* is the
        # non-deprecated one as of the v3.6.25 this project pins.
        - traefik.swarm.network=${TRAEFIK_NETWORK:-approve-control-plane}
        - traefik.http.routers.approve-auth-admin.rule=Host(`${ADMIN_HOSTNAME:?set ADMIN_HOSTNAME to the real admin console hostname}`)
        - traefik.http.routers.approve-auth-admin.entrypoints=websecure
        - traefik.http.routers.approve-auth-admin.tls=true
        - traefik.http.routers.approve-auth-admin.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-default}
        - traefik.http.routers.approve-auth-admin.service=approve-auth-admin
        - traefik.http.services.approve-auth-admin.loadbalancer.server.port=8081
    # "Gracefully drain for up to 30 seconds" (spec section 13).
    stop_grace_period: 30s

networks:
  # Shared with Traefik -- external, because this network is not this
  # stack's to create: it must already exist (created by Traefik's own
  # stack, or by hand: `docker network create --driver overlay
  # --attachable approve-control-plane`) and Traefik's own service must
  # already be attached to it, or routing never works regardless of the
  # traefik.swarm.network label above. If your existing Traefik ingress
  # network is called something else (e.g. the common "traefik_public"
  # convention), export TRAEFIK_NETWORK to match it -- the label above
  # reads the same variable, so they can't drift apart.
  control-plane:
    external: true
    name: ${TRAEFIK_NETWORK:-approve-control-plane}
  db:
    driver: overlay
    internal: true
    attachable: false
  ops:
    driver: overlay
    internal: true
    attachable: true

volumes:
  db-data:
    driver: local

configs:
  # external, not `file:` -- a `file:` path is resolved against
  # whichever filesystem actually runs `docker stack deploy`, which for
  # a Portainer-managed deploy is Portainer's OWN container, not the
  # Swarm node's filesystem ("cannot find file" even though the file is
  # right there on the node is exactly this mismatch). Create the
  # config content once, from wherever you actually run the deploy
  # from:
  #   docker config create approve-auth-config /path/to/approve-auth-config.yaml
  # or, if deploying via Portainer's UI: Configs -> Add config, name it
  # exactly "approve-auth-config", paste the file's contents. Re-running
  # either one to pick up a config change requires removing the old
  # config and its name isn't reusable while any service still
  # references it -- see docs/runbooks/rollout-rollback.md.
  approve-auth-config:
    external: true

secrets:
  db_superuser_name:
    external: true
  db_superuser_password:
    external: true
  database_url_superuser:
    external: true
  database_url:
    external: true
  oidc_client_secret:
    external: true
  claim_encryption_key:
    external: true
  oidc_state_key:
    external: true
  auth_tls_cert:
    external: true
  auth_tls_key:
    external: true
  auth_client_ca:
    external: true
