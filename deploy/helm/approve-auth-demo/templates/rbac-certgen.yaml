# Scoped to exactly what templates/certgen-job.yaml needs: create/read/
# update Secrets in this release's own namespace only, nothing else --
# never cluster-scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "approve-auth-demo.fullname" . }}-certgen
  labels:
    {{- include "approve-auth-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "approve-auth-demo.fullname" . }}-certgen
  labels:
    {{- include "approve-auth-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # `kubectl apply` patches when the object already exists (e.g. a
    # retried Job attempt, or `helm upgrade` re-running this hook) --
    # these Secrets are created by the Job's own kubectl call, not by
    # Helm directly, so Helm's hook-delete-policy on the Job itself
    # doesn't clean them up first.
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "approve-auth-demo.fullname" . }}-certgen
  labels:
    {{- include "approve-auth-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "approve-auth-demo.fullname" . }}-certgen
subjects:
  - kind: ServiceAccount
    name: {{ include "approve-auth-demo.fullname" . }}-certgen
    namespace: {{ .Release.Namespace }}
