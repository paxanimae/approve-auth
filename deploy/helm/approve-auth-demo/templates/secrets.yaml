# Fixed, publicly-known demo values -- deploy/helm/approve-auth (the
# real chart) requires these to already exist as Secrets you create
# yourself; this demo chart creates them itself so `helm install` needs
# no prerequisite at all. `stringData` here is not a real secret by any
# definition -- these values are checked straight into this chart's git
# history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "approve-auth-demo.fullname" . }}-app
  labels:
    {{- include "approve-auth-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-40"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  database_url: postgres://approve_auth_app:devpassword@{{ include "approve-auth-demo.component.fullname" (dict "root" . "name" "db") }}:5432/approve_auth?sslmode=disable
  oidc_client_secret: demo-client-secret
  claim_encryption_key: s9BtMLlcCrE3HhGgk8mvEl+tNR/QRl8faZs/RXb14Ls=
  oidc_state_key: mi5aWKpBNmWPyxnhU1MsXeEm4yBaLzn35uG/B98V+S0=
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "approve-auth-demo.fullname" . }}-db-superuser
  labels:
    {{- include "approve-auth-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-40"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  db_superuser_name: postgres
  db_superuser_password: demo-postgres-password
  database_url_superuser: postgres://postgres:demo-postgres-password@{{ include "approve-auth-demo.component.fullname" (dict "root" . "name" "db") }}:5432/approve_auth?sslmode=disable
