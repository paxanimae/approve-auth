{{- if .Values.db.enabled -}}
# The Kubernetes equivalent of deploy/stack.yml's bundled `db` service:
# single-replica, self-hosted Postgres, a documented single point of
# failure (spec section 13 says so explicitly -- this is not this
# chart papering over anything the compose version already handles
# better). volumeClaimTemplates below is this chart's version of that
# file's own `db-data` named local volume + its
# `node.labels.approve-auth-db-storage == true` placement constraint;
# a real StorageClass with its own topology awareness usually makes
# nodeSelector unnecessary here, unlike Swarm's plain local driver.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "approve-auth.db.fullname" . }}
  labels:
    {{- include "approve-auth.db.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "approve-auth.db.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "approve-auth.db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "approve-auth.db.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.db.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          env:
            - name: POSTGRES_DB
              value: approve_auth
            - name: POSTGRES_USER_FILE
              value: /run/secrets/db_superuser_name
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db_superuser_password
          ports:
            - name: postgres
              containerPort: 5432
          # Identical to deploy/stack.yml's own healthcheck: command,
          # secret file, and target database all match.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$(cat /run/secrets/db_superuser_name)" -d approve_auth
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$(cat /run/secrets/db_superuser_name)" -d approve_auth
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ required "db.existingSecret is required when db.enabled" .Values.db.existingSecret }}
                  items:
                    - key: db_superuser_name
                      path: db_superuser_name
                    - key: db_superuser_password
                      path: db_superuser_password
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.db.storage.storageClassName }}
        storageClassName: {{ .Values.db.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.db.storage.size }}
{{- end }}
