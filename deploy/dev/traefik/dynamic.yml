# Rendered dev version of spec section 6's example file-provider config,
# for the real-Traefik integration test. Not a production deployment
# artifact -- see deploy/stack.yml (Milestone 5) for that.
tls:
  certificates:
    - certFile: /certs/protected.localtest.me.pem
      keyFile: /certs/protected.localtest.me-key.pem
    - certFile: /certs/admin.localtest.me.pem
      keyFile: /certs/admin.localtest.me-key.pem
    - certFile: /certs/mock-oidc.localtest.me.pem
      keyFile: /certs/mock-oidc.localtest.me-key.pem

http:
  middlewares:
    manual-approval:
      forwardAuth:
        address: https://manual-approval:8443/auth
        trustForwardHeader: true
        preserveLocationHeader: true
        forwardBody: false
        authRequestHeaders:
          - Cookie
          - Accept
          - User-Agent
          - Sec-Fetch-Mode
          - Sec-Fetch-Dest
        addAuthCookiesToResponse:
          - __Host-manual-proxy
        tls:
          ca: /mtls/ca-cert.pem
          cert: /mtls/traefik-client-cert.pem
          key: /mtls/traefik-client-key.pem

  routers:
    protected-app:
      rule: "Host(`protected.localtest.me`)"
      entryPoints:
        - websecure
      tls: {}
      priority: 100
      middlewares:
        - manual-approval
      service: backend-protected

    # Higher priority, no manual-approval middleware, and no other
    # service paths -- spec section 6's router topology requirement.
    protected-app-approval:
      rule: "Host(`protected.localtest.me`) && (Path(`/__manual-approval`) || PathPrefix(`/__manual-approval/`))"
      entryPoints:
        - websecure
      tls: {}
      priority: 1000
      service: manual-public

    # Dedicated admin hostname, dedicated listener (spec section 2/9) --
    # a separate router/service from the reserved-path one above, never
    # the manual-approval ForwardAuth middleware.
    manual-admin:
      rule: "Host(`admin.localtest.me`)"
      entryPoints:
        - websecure
      tls: {}
      service: manual-admin

    # Only mock-oidc's /authorize needs to be browser-reachable at all
    # (discovery/jwks/token are called backend-to-backend, directly at
    # http://mock-oidc:8090, by cmd/server) -- see cmd/mock-oidc's
    # -authorize-url flag and deploy/dev/docker-compose.yml.
    mock-oidc:
      rule: "Host(`mock-oidc.localtest.me`)"
      entryPoints:
        - websecure
      tls: {}
      service: mock-oidc

  services:
    backend-protected:
      loadBalancer:
        servers:
          - url: "http://backend-protected:80"

    manual-public:
      loadBalancer:
        servers:
          - url: "http://manual-approval:8080"

    manual-admin:
      loadBalancer:
        servers:
          - url: "http://manual-approval:8081"

    mock-oidc:
      loadBalancer:
        servers:
          - url: "http://mock-oidc:8090"
