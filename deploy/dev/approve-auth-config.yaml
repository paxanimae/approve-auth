# Dev-only nonsecret config for the approve-auth service in the
# real-Traefik integration compose stack. Not a production config
# example -- see deploy/stack.yml (Milestone 5) for that.
# :18443 because that's the nonstandard port this dev Traefik stack
# publishes on (see docs/dev-environment.md) -- a real deployment's
# ADMIN_ORIGIN has no port, since Traefik only ever publishes 443.
admin_origin: https://admin.localtest.me:18443
# mock-oidc (see cmd/mock-oidc): a real, minimal OIDC provider standing
# in for the organizational IdP in this dev stack only.
oidc_issuer: http://mock-oidc:8090
oidc_client_id: dev-placeholder
oidc_admin_groups: ["grp-admins"]
oidc_viewer_groups: ["grp-viewers"]

claim_encryption_key_id: dev

auth_tls_cert_file: /mtls/server-cert.pem
auth_tls_key_file: /mtls/server-key.pem
auth_client_ca_file: /mtls/ca-cert.pem
auth_allowed_client_identities: ["traefik-client"]

# The whole compose bridge network -- fine for this dev/test stack, but a
# production deployment must scope this to the actual Traefik network
# ranges (spec section 6).
trusted_traefik_cidrs: ["0.0.0.0/0"]
