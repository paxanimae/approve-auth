# Local development stack only -- not used in CI (which uses a GitHub
# Actions Postgres service container instead) and not a production
# deployment artifact (see deploy/stack.yml, added in a later milestone).
#
# Brings up:
#   db                 - PostgreSQL, for `scripts/dev.sh test`
#                        (TEST_DATABASE_URL) and for running the service
#                        locally against real Postgres.
#   app-a, app-b       - Two independent HTTPS hosts (self-signed certs
#                        from scripts/gen-certs.sh; run that first)
#                        proving two-origin TLS separation exists to
#                        build on for cookie-isolation tests. Unrelated
#                        to the real-Traefik stack below.
#   migrate            - One-shot: applies migrations with a privileged
#                        connection, then exits (spec section 13: "a
#                        one-off, locked migration step").
#   approve-auth    - The actual service, built from ../../Dockerfile,
#                        connecting with its least-privilege runtime role.
#   mock-oidc          - A real, minimal OIDC provider for the admin
#                        console's login flow (see cmd/mock-oidc) --
#                        never a production component.
#   backend-protected  - A Caddy placeholder standing in for the
#                        protected application behind Traefik.
#   traefik            - Real Traefik, wired with the ForwardAuth
#                        middleware from spec section 6 (rendered into
#                        ./traefik/dynamic.yml). The only service that
#                        publishes a host port for this part of the
#                        stack -- see docs/dev-environment.md.
#
# Run scripts/gen-certs.sh and scripts/gen-mtls-certs.sh first.
# scripts/fetch-geoip.sh is a separate, optional step (see the
# approve-auth service's GEOIP_DATABASE_PATH below) -- unlike the certs,
# skipping it does not stop this stack from starting.
name: approve-auth

services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: approve_auth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d approve_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev

  app-a:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:10443:443"
    volumes:
      - ./Caddyfile.app-a:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - dev

  app-b:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:10444:443"
    volumes:
      - ./Caddyfile.app-b:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - dev

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    entrypoint: ["/usr/local/bin/admin", "migrate-up"]
    environment:
      DATABASE_URL_FILE: /secrets/database-url-superuser.txt
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev

  approve-auth:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    # Dev-only override: Docker Desktop's Windows bind-mount layer serves
    # host files to Linux containers in a way the image's nonroot user
    # (uid 65532) can't always read, regardless of the host-side
    # permission bits. A real deployment uses Swarm secrets/volumes with
    # correct ownership instead of a host bind mount, so this override
    # has no production equivalent -- see deploy/stack.yml (Milestone 5).
    user: "0:0"
    environment:
      CONFIG_FILE: /config/approve-auth.yaml
      DATABASE_URL_FILE: /secrets/database-url.txt
      OIDC_CLIENT_SECRET_FILE: /secrets/oidc-client-secret.txt
      CLAIM_ENCRYPTION_KEY_FILE: /secrets/claim-encryption-key.txt
      OIDC_STATE_ENCRYPTION_KEY_FILE: /secrets/oidc-state-key.txt
      # Uncomment after running scripts/fetch-geoip.sh -- a configured
      # path that doesn't exist is a fatal startup error (cmd/server
      # treats a bad GeoIP path as a misconfiguration to fail loudly on,
      # not a silent no-op), so this stays commented out by default and
      # the ./geoip mount below stays harmless (an empty directory) until
      # you've actually fetched the database.
      # GEOIP_DATABASE_PATH: /geoip/GeoLite2-City.mmdb
    volumes:
      - ./approve-auth-config.yaml:/config/approve-auth.yaml:ro
      - ./secrets:/secrets:ro
      - ./mtls:/mtls:ro
      - ./geoip:/geoip:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-oidc:
        condition: service_started
    networks:
      - dev

  # A real (not stubbed) OIDC provider for local dev and the
  # real-Traefik integration stack, so the admin console's OIDC login
  # can be exercised through an actual browser round trip -- see
  # cmd/mock-oidc's doc comment. Never part of a release image.
  mock-oidc:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: mock-oidc
    restart: unless-stopped
    command:
      - -issuer=http://mock-oidc:8090
      - -authorize-url=https://mock-oidc.localtest.me:18443/authorize
      - -client-id=dev-placeholder
      - -groups=grp-admins
    networks:
      - dev

  backend-protected:
    image: caddy:2.10.2
    restart: unless-stopped
    volumes:
      - ./Caddyfile.protected:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - dev

  traefik:
    image: traefik:v3.6.25
    restart: unless-stopped
    command:
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=INFO
    ports:
      - "127.0.0.1:18443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./certs:/certs:ro
      - ./mtls:/mtls:ro
    depends_on:
      - approve-auth
      - backend-protected
    networks:
      - dev

networks:
  dev:
    name: approve-auth_dev

volumes:
  db-data:
