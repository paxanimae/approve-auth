# Local development stack only -- not used in CI (which uses a GitHub
# Actions Postgres service container instead) and not a production
# deployment artifact (see deploy/stack.yml, added in a later milestone).
#
# Brings up:
#   db      - PostgreSQL, for `scripts/dev.sh test` (TEST_DATABASE_URL) and
#             for running the service locally against real Postgres.
#   app-a,
#   app-b   - Two independent HTTPS hosts (self-signed certs from
#             scripts/gen-certs.sh; run that first) proving two-origin TLS
#             separation exists to build on for Milestone 2's cookie-
#             isolation tests. They do NOT run the actual
#             traefik-manual-proxy service or touch the Docker socket --
#             see docs/dev-environment.md.
name: traefik-manual-proxy

services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: manual_approval
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manual_approval"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev

  app-a:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:10443:443"
    volumes:
      - ./Caddyfile.app-a:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - dev

  app-b:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:10444:443"
    volumes:
      - ./Caddyfile.app-b:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      - dev

networks:
  dev:
    name: traefik-manual-proxy_dev

volumes:
  db-data:
