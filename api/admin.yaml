openapi: 3.1.0
info:
  title: Approve -- Admin API
  version: "0.5.0"
  description: >
    OIDC login/callback/logout and the /api/v1 admin console API (spec
    section 9), served on the Admin listener only. Reflects the actual
    implementation as of Milestone 5 (internal/httpserver's admin_*.go
    handlers), not a draft -- see "Known deviations from the spec text"
    below for the few places this intentionally differs from spec
    section 9's literal wording.

    Known deviations from the spec text:
      - Optimistic-concurrency version checks travel as a `version`
        field in the JSON request body, not an `If-Match` header. Same
        semantics (stale version -> 409 with the current state), just a
        body field instead of a header.
      - List endpoints (`GET /requests`, `/authorizations`,
        `/audit-events`) take a plain `limit` (default 50, max 200), not
        cursor pagination -- a simple limit-bounded listing, tracked as
        follow-on work in each handler's own comment.
      - The `Idempotency-Key` header spec section 9 describes (store
        results 24h, replay returns the original result) is not
        implemented; a resubmitted stale mutation still safely fails via
        the version check above, it just isn't deduplicated if byte-for-
        byte identical and not stale.
security:
  - adminSessionCookie: []
paths:
  /auth/login:
    get:
      operationId: adminLogin
      summary: Start the OIDC Authorization Code + PKCE flow
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "302":
          description: Redirect to the OIDC provider's authorization endpoint
          headers:
            Location:
              schema:
                type: string

  /auth/callback:
    get:
      operationId: adminCallback
      summary: OIDC callback -- exchanges the code, creates the admin session
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Session cookie set; redirect to the validated return path
          headers:
            Set-Cookie:
              schema:
                type: string
            Location:
              schema:
                type: string
        "400":
          description: Invalid, expired, or already-used login attempt
          $ref: "#/components/responses/Error"
        "403":
          description: Authenticated identity is not a member of any allowlisted group
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: adminLogout
      summary: End the caller's own admin session (any role)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged_out:
                    type: boolean
                required: [logged_out]
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: Missing or invalid X-CSRF-Token
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      operationId: getMe
      summary: Current admin identity, role, and CSRF token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/overview:
    get:
      operationId: getOverview
      summary: Pending / active / expiring-soon / recently revoked-or-expired counts (administrator/viewer only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: application_owner role (staff-only endpoint)
          $ref: "#/components/responses/Error"

  /api/v1/applications:
    get:
      operationId: listApplications
      summary: List every registered application, alphabetical by hostname (administrator/viewer only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Application"
                required: [applications]
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: application_owner role (staff-only endpoint)
          $ref: "#/components/responses/Error"
    post:
      operationId: createApplication
      summary: Register a new application (exact hostname)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "403":
          description: Not an administrator, or missing/invalid X-CSRF-Token
          $ref: "#/components/responses/Error"
        "409":
          description: An application with this hostname is already registered
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getApplication
      summary: Application detail (administrator/viewer only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "403":
          description: application_owner role (staff-only endpoint)
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateApplication
      summary: Update display name/description/policy (hostname is immutable)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: Stale version
          $ref: "#/components/responses/Error"
        "422":
          description: default_duration_seconds/max_duration_seconds invalid
          $ref: "#/components/responses/Error"

  /api/v1/applications/{id}/disable:
    post:
      operationId: disableApplication
      summary: Disable, cancel pending requests, revoke live grants (reason required)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                reason:
                  type: string
              required: [version, reason]
      responses:
        "200":
          description: OK -- includes how many rows were affected, for the confirmation UI
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: "#/components/schemas/Application"
                  canceled_requests:
                    type: integer
                  revoked_authorizations:
                    type: integer
                required: [application, canceled_requests, revoked_authorizations]
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          description: reason is required
          $ref: "#/components/responses/Error"

  /api/v1/applications/{id}/enable:
    post:
      operationId: enableApplication
      summary: Re-enable new enrollment (does not restore prior access)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
              required: [version]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/applications/{id}/owners:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listApplicationOwners
      summary: List the OIDC subjects granted the application_owner role for this application
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  owners:
                    type: array
                    items:
                      type: string
                required: [owners]
        "403":
          description: application_owner role (staff-only endpoint)
          $ref: "#/components/responses/Error"
    post:
      operationId: grantApplicationOwner
      summary: >-
        Grant the application_owner role for this application to an OIDC
        subject (administrator-only -- an ApplicationOwner cannot grant
        ownership to anyone, including themselves)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
              required: [subject]
      responses:
        "201":
          description: Created (idempotent -- granting an already-owned application is a no-op, not an error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  granted:
                    type: boolean
                required: [granted]
        "403":
          description: Not an administrator, or missing/invalid X-CSRF-Token
          $ref: "#/components/responses/Error"
        "404":
          description: No such application
          $ref: "#/components/responses/Error"
        "422":
          description: subject is required
          $ref: "#/components/responses/Error"

  /api/v1/applications/{id}/owners/{subject}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: subject
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeApplicationOwner
      summary: Revoke the application_owner role for this application from an OIDC subject (administrator-only)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: OK (idempotent -- revoking a non-owner is a no-op, not an error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                required: [revoked]
        "403":
          description: Not an administrator, or missing/invalid X-CSRF-Token
          $ref: "#/components/responses/Error"

  /api/v1/requests:
    get:
      operationId: listRequests
      summary: >-
        List requests, optionally filtered by application/status. An
        application_owner caller sees only requests for applications
        they own (spec: "cannot control anything else").
      parameters:
        - name: application_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, denied, canceled, timed_out, claimed, claim_expired]
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK -- newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/Request"
                required: [requests]

  /api/v1/requests/{id}:
    get:
      operationId: getRequest
      summary: Request detail (404 for an application_owner viewing an application they don't own)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/requests/{id}/approve:
    post:
      operationId: approveRequest
      summary: >-
        Approve, creating an unclaimed authorization. Administrator, or
        application_owner for a request on an application they own
        (404, not 403, for one they don't).
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequestInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_id:
                    type: string
                    format: uuid
                  expires_at:
                    type: string
                    format: date-time
                required: [authorization_id, expires_at]
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: Stale version, or the request is no longer pending
          $ref: "#/components/responses/Error"
        "422":
          description: expires_at is not in the future, or exceeds the application's maximum duration
          $ref: "#/components/responses/Error"

  /api/v1/requests/{id}/deny:
    post:
      operationId: denyRequest
      summary: >-
        Deny (reason required; optional safe public message).
        Administrator, or application_owner for a request on an
        application they own.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                reason:
                  type: string
                public_message:
                  type: string
              required: [version, reason]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  denied:
                    type: boolean
                required: [denied]
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          description: reason is required
          $ref: "#/components/responses/Error"

  /api/v1/requests/{id}/notes:
    get:
      operationId: listRequestNotes
      summary: List a request's notes, oldest first (append-only)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
                required: [notes]
    post:
      operationId: addRequestNote
      summary: Append a note to a request (never editable or deletable afterward)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required: [body]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          description: body must be between 1 and 2000 characters
          $ref: "#/components/responses/Error"

  /api/v1/authorizations:
    get:
      operationId: listAuthorizations
      summary: >-
        List authorizations, soonest-expiring first. An
        application_owner caller sees only authorizations for
        applications they own.
      parameters:
        - name: application_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: active_only
          in: query
          required: false
          description: Defaults to true; false includes revoked/expired rows too
          schema:
            type: boolean
            default: true
        - name: mine
          in: query
          required: false
          description: >-
            "My Approvals" -- restricts to authorizations the calling
            admin approved, resolved server-side from the caller's own
            session (never a client-supplied identity).
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Authorization"
                required: [authorizations]

  /api/v1/authorizations/{id}:
    get:
      operationId: getAuthorization
      summary: Authorization detail (404 for an application_owner viewing an application they don't own)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/authorizations/{id}/renew:
    post:
      operationId: renewAuthorization
      summary: Renew (new_expires_at must exceed current and stay within the credential ceiling)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewAuthorizationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  renewed:
                    type: boolean
                required: [renewed]
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: Stale version, or the authorization is revoked/unclaimed/expired
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/authorizations/{id}/revoke:
    post:
      operationId: revokeAuthorization
      summary: >-
        Revoke (reason required). Administrator, or application_owner
        for an authorization on an application they own.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                reason:
                  type: string
              required: [version, reason]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                required: [revoked]
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          description: reason is required
          $ref: "#/components/responses/Error"

  /api/v1/authorizations/{id}/clear-flag:
    post:
      operationId: clearAuthorizationFlag
      summary: >-
        Acknowledge a revocation-policy flag_for_review state
        (internal/revokepolicy) once reviewed -- idempotent, clearing
        an authorization that isn't flagged succeeds as a no-op.
        Administrator, or application_owner for an authorization on an
        application they own.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: boolean
                required: [cleared]
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/authorizations/{id}/notes:
    get:
      operationId: listAuthorizationNotes
      summary: List an authorization's notes, oldest first (append-only)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
                required: [notes]
    post:
      operationId: addAuthorizationNote
      summary: Append a note to an authorization (never editable or deletable afterward)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required: [body]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          description: body must be between 1 and 2000 characters
          $ref: "#/components/responses/Error"

  /api/v1/authorizations/bulk-renew:
    post:
      operationId: bulkRenewAuthorizations
      summary: Explicit IDs + versions, duration_days (added to each row's own current expiry), reason; max 100
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRenewInput"
      responses:
        "200":
          description: >
            Always 200 once the request itself is well-formed -- each
            item is transactionally independent and reports its own
            success/error; the response never implies the whole
            operation succeeded or failed as a unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          description: items empty/over 100, or duration_days not positive
          $ref: "#/components/responses/Error"

  /api/v1/authorizations/bulk-revoke:
    post:
      operationId: bulkRevokeAuthorizations
      summary: Explicit IDs + versions, reason; max 100
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRevokeInput"
      responses:
        "200":
          description: Always 200 once the request itself is well-formed -- see bulk-renew's description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          description: items empty/over 100, or reason missing
          $ref: "#/components/responses/Error"

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: Filtered audit events, newest first (administrator/viewer only)
      parameters:
        - name: application_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: actor_subject
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure]
        - name: occurred_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: occurred_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit_events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                required: [audit_events]

  /api/v1/audit-events/export:
    get:
      operationId: exportAuditEvents
      summary: CSV export of the filtered result set (max 10,000 rows); the export itself is audited (administrator/viewer only)
      parameters:
        - name: application_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: actor_subject
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure]
      responses:
        "200":
          description: >
            CSV, with a leading single quote prepended to any field
            value starting with =, +, -, @, a tab, or a carriage return
            (spreadsheet-formula-injection sanitization).
          content:
            text/csv:
              schema:
                type: string

  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Deployment-wide business-rule defaults (administrator/viewer only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalSettings"
        "403":
          description: application_owner role (staff-only endpoint)
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      summary: Update deployment-wide business-rule defaults (administrator only)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGlobalSettingsInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalSettings"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: Stale version
          $ref: "#/components/responses/Error"
        "422":
          description: Invalid revoke_policy_*, revocation_inactivity_threshold_seconds, or notify_default_webhook_url
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-approve-auth-admin

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the caller's own session's csrf_token (from GET /api/v1/me)
      schema:
        type: string

  schemas:
    Me:
      type: object
      properties:
        subject:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [viewer, administrator, application_owner]
        csrf_token:
          type: string
      required: [subject, display_name, role, csrf_token]
      additionalProperties: false

    Overview:
      type: object
      properties:
        pending:
          type: integer
        active:
          type: integer
        expiring_soon:
          type: integer
        revoked_or_expired_recent:
          type: integer
      required: [pending, active, expiring_soon, revoked_or_expired_recent]
      additionalProperties: false

    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        display_name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        default_duration_seconds:
          type: integer
        max_duration_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
        contact_info:
          type: string
          description: >-
            Absent means this application uses the deployment-wide
            contact_info config default instead of an override of its
            own.
        notify_email:
          type: string
          description: >-
            Absent means this application uses the deployment-wide
            notify_default_email config default instead of an override
            of its own.
        notify_webhook_url:
          type: string
          description: >-
            Absent means this application uses the deployment-wide
            notify_default_webhook_url config default instead of an
            override of its own.
        revoke_policy_ip_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
          description: >-
            Absent means this application uses the deployment-wide
            revocation-policy default for this signal instead of an
            override of its own (internal/revokepolicy). A session's
            own override, if set, takes priority over this.
        revoke_policy_user_agent_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
        revoke_policy_inactivity_exceeded:
          type: string
          enum: [off, warn, flag_for_review, revoke]
        allow_anonymous_message:
          type: boolean
          description: >-
            False by default for every application (migration 000020,
            endpoint-review.md F3). Whether the anonymous enrollment
            page may accept a non-empty label or message at all --
            unlike the fields above, always present, never an
            inherits-a-default state.
      required: [id, hostname, display_name, description, enabled, default_duration_seconds, max_duration_seconds, created_at, updated_at, version, allow_anonymous_message]
      additionalProperties: false

    CreateApplicationInput:
      type: object
      properties:
        hostname:
          type: string
          description: Lowercase ASCII IDNA form, no port, no path (spec section 3)
        display_name:
          type: string
        description:
          type: string
        default_duration_seconds:
          type: integer
          description: Zero means "use this deployment's configured default"
        max_duration_seconds:
          type: integer
          description: Zero means "use this deployment's configured default"
        contact_info:
          type: string
          maxLength: 500
          description: Omit to use the deployment-wide contact_info config default
        notify_email:
          type: string
          maxLength: 320
          description: Omit to use the deployment-wide notify_default_email config default
        notify_webhook_url:
          type: string
          description: >-
            Must be an absolute http(s) URL if set. Omit to use the
            deployment-wide notify_default_webhook_url config default.
      required: [hostname, display_name]
      additionalProperties: false

    UpdateApplicationInput:
      type: object
      properties:
        version:
          type: integer
        display_name:
          type: string
        description:
          type: string
        default_duration_seconds:
          type: integer
        max_duration_seconds:
          type: integer
        contact_info:
          type: string
          maxLength: 500
          description: An empty string clears the override back to the global default
        notify_email:
          type: string
          maxLength: 320
          description: An empty string clears the override back to the global default
        notify_webhook_url:
          type: string
          description: >-
            Must be an absolute http(s) URL if set. An empty string
            clears the override back to the global default.
        revoke_policy_ip_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
          description: An empty string clears the override back to the deployment-wide default
        revoke_policy_user_agent_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
        revoke_policy_inactivity_exceeded:
          type: string
          enum: [off, warn, flag_for_review, revoke]
        allow_anonymous_message:
          type: boolean
          description: Omit to leave unchanged.
      required: [version]
      additionalProperties: false

    GlobalSettings:
      type: object
      description: >-
        The deployment-wide business-rule defaults (migration
        000019) -- editable live from the admin console's Settings
        page, unlike everything still in static config.
      properties:
        contact_info:
          type: string
          description: Absent means unset -- there is no further fallback below this.
        notify_email_from:
          type: string
        notify_default_email:
          type: string
        notify_default_webhook_url:
          type: string
        revoke_policy_ip_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
          description: >-
            Always present -- unlike an application's own override,
            this NOT NULL column has no "unset" state
            (internal/revokepolicy).
        revoke_policy_user_agent_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
        revoke_policy_inactivity_exceeded:
          type: string
          enum: [off, warn, flag_for_review, revoke]
        revocation_inactivity_threshold_seconds:
          type: integer
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
      required:
        [
          revoke_policy_ip_changed,
          revoke_policy_user_agent_changed,
          revoke_policy_inactivity_exceeded,
          revocation_inactivity_threshold_seconds,
          updated_at,
          version,
        ]
      additionalProperties: false

    UpdateGlobalSettingsInput:
      type: object
      properties:
        version:
          type: integer
        contact_info:
          type: string
          maxLength: 500
          description: An empty string clears it back to unset
        notify_email_from:
          type: string
          maxLength: 320
          description: An empty string clears it back to unset
        notify_default_email:
          type: string
          maxLength: 320
          description: An empty string clears it back to unset
        notify_default_webhook_url:
          type: string
          description: >-
            Must be an absolute http(s) URL if set. An empty string
            clears it back to unset.
        revoke_policy_ip_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
          description: >-
            Unlike an application's own override, this has no
            "unset" state -- if sent, it must be one of the four
            listed actions.
        revoke_policy_user_agent_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
        revoke_policy_inactivity_exceeded:
          type: string
          enum: [off, warn, flag_for_review, revoke]
        revocation_inactivity_threshold_seconds:
          type: integer
          description: Must be positive if set
      required: [version]
      additionalProperties: false

    Request:
      type: object
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        application_hostname:
          type: string
        application_display_name:
          type: string
        verification_code:
          type: string
        label:
          type: [string, "null"]
        message:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, approved, denied, canceled, timed_out, claimed, claim_expired]
        requested_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time
        decided_by:
          type: [string, "null"]
        claim_deadline_at:
          type: [string, "null"]
          format: date-time
        claimed_at:
          type: [string, "null"]
          format: date-time
        public_decision_message:
          type: [string, "null"]
        private_note:
          type: [string, "null"]
        source_ip:
          type: [string, "null"]
        source_geo_country:
          type: [string, "null"]
          description: Best-effort GeoIP lookup of source_ip; null if no GeoIP database is configured or the lookup didn't resolve
        source_geo_city:
          type: [string, "null"]
        user_agent:
          type: [string, "null"]
        version:
          type: integer
      required: [id, application_id, application_hostname, application_display_name, verification_code, status, requested_at, deadline_at, version]
      additionalProperties: false

    ApproveRequestInput:
      type: object
      properties:
        version:
          type: integer
        expires_at:
          type: string
          format: date-time
          description: Omit to use the application's configured default duration
        label:
          type: string
          maxLength: 100
        private_note:
          type: string
        revoke_policy_ip_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
          description: >-
            This session's own revocation-policy override for the
            IPChanged signal (internal/revokepolicy) -- set only here,
            at approval time; omit to inherit the application's own
            override or the deployment-wide default.
        revoke_policy_user_agent_changed:
          type: string
          enum: [off, warn, flag_for_review, revoke]
        revoke_policy_inactivity_exceeded:
          type: string
          enum: [off, warn, flag_for_review, revoke]
      required: [version]
      additionalProperties: false

    Authorization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        application_hostname:
          type: string
        application_display_name:
          type: string
        request_id:
          type: string
          format: uuid
        label:
          type: [string, "null"]
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        activated_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        revoked_by:
          type: [string, "null"]
        revocation_reason:
          type: [string, "null"]
        last_seen_at:
          type: [string, "null"]
          format: date-time
        last_seen_user_agent:
          type: [string, "null"]
        version:
          type: integer
        flagged_at:
          type: [string, "null"]
          format: date-time
          description: >-
            Set when a revocation-policy signal resolved to
            flag_for_review (internal/revokepolicy) -- access is
            unaffected; this is a "needs a human's attention" marker
            only, cleared via POST .../clear-flag.
        flagged_reason:
          type: [string, "null"]
        revoke_policy_ip_changed:
          type: [string, "null"]
          enum: [off, warn, flag_for_review, revoke, null]
          description: Absent/null means this session inherits the application's own override or the deployment-wide default.
        revoke_policy_user_agent_changed:
          type: [string, "null"]
          enum: [off, warn, flag_for_review, revoke, null]
        revoke_policy_inactivity_exceeded:
          type: [string, "null"]
          enum: [off, warn, flag_for_review, revoke, null]
      required: [id, application_id, application_hostname, application_display_name, request_id, approved_by, approved_at, expires_at, version]
      additionalProperties: false

    Note:
      type: object
      description: >-
        Shared shape for both a request's and an authorization's notes
        -- distinct source tables, identical fields. Append-only: no
        edit or delete operation exists for either.
      properties:
        id:
          type: string
          format: uuid
        author_subject:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, author_subject, body, created_at]
      additionalProperties: false

    RenewAuthorizationInput:
      type: object
      properties:
        version:
          type: integer
        new_expires_at:
          type: string
          format: date-time
        reason:
          type: string
      required: [version, new_expires_at, reason]
      additionalProperties: false

    BulkItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
      required: [id, version]
      additionalProperties: false

    BulkRenewInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkItem"
        duration_days:
          type: integer
          description: Added to each authorization's own current expires_at, not a fixed absolute date
        reason:
          type: string
      required: [items, duration_days, reason]
      additionalProperties: false

    BulkRevokeInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BulkItem"
        reason:
          type: string
      required: [items, reason]
      additionalProperties: false

    BulkResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              success:
                type: boolean
              error:
                type: string
                description: A fixed error code (e.g. conflict, invalid_id, invalid_expiry); present only when success is false
            required: [id, success]
      required: [results]
      additionalProperties: false

    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [admin, browser, system]
        actor_subject:
          type: [string, "null"]
        action:
          type: string
        application_id:
          type: [string, "null"]
          format: uuid
        request_id:
          type: [string, "null"]
          format: uuid
        authorization_id:
          type: [string, "null"]
          format: uuid
        correlation_id:
          type: string
          format: uuid
        reason:
          type: [string, "null"]
        outcome:
          type: string
          enum: [success, failure]
      required: [id, occurred_at, actor_type, action, correlation_id, outcome]
      additionalProperties: false

    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
          required: [code, message, request_id]
      required: [error]

  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
