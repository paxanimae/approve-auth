openapi: 3.1.0
info:
  title: Approve -- Public API
  version: "0.5.0"
  description: >
    Same-host reserved-path endpoints (spec section 9), served on the
    Public listener only, under Traefik's `/__approve-auth` reserved
    router. Reflects the actual implementation as of Milestone 5
    (internal/httpserver's enrollment_handlers.go), not a draft.

    Every POST endpoint here accepts both `application/x-www-form-
    urlencoded` (the no-JS HTML form path, which responds with a 303
    redirect) and `application/json` (which responds with a JSON body
    instead) -- content negotiation is by the caller's own Content-Type/
    Accept headers, not a separate path.
paths:
  /__approve-auth/request:
    get:
      operationId: getRequestPage
      summary: Enrollment request page (HTML form, CSRF bootstrap)
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: HTML enrollment form; sets the pending-proof cookie if the caller didn't already have a live one
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Duplicate pending-request cookie (malformed client state)
          $ref: "#/components/responses/Error"
        "403":
          description: This application is unknown or disabled
          $ref: "#/components/responses/Error"

  /__approve-auth/requests:
    post:
      operationId: createRequest
      summary: Create or reuse a pending approval request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SubmitRequestForm"
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequestForm"
      responses:
        "201":
          description: Created (JSON caller) -- repeated submissions with the same pending proof reuse the existing pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitRequestResult"
        "303":
          description: Redirect to the waiting page (HTML form caller)
          headers:
            Location:
              schema:
                type: string
        "400":
          description: Missing pending-proof cookie, or a malformed body
          $ref: "#/components/responses/Error"
        "403":
          description: Bad Origin, or this application is unavailable
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /__approve-auth/waiting:
    get:
      operationId: getWaitingPage
      summary: Waiting page for the current pending proof
      responses:
        "200":
          description: HTML waiting page, reflecting the current request's state (or "not requested" if there is none)
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Duplicate pending-request cookie
          $ref: "#/components/responses/Error"

  /__approve-auth/status:
    get:
      operationId: getStatus
      summary: Poll the current pending request's status
      responses:
        "200":
          description: >
            Status snapshot, no PII beyond the caller's own request.
            `{"state": "not_requested", "server_time": ...}` if there is
            no live pending proof at all (never an error for that case).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "429":
          $ref: "#/components/responses/RateLimited"

  /__approve-auth/cancel:
    post:
      operationId: cancelRequest
      summary: Cancel the caller's own pending/unclaimed request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfOnlyForm"
          application/json:
            schema:
              $ref: "#/components/schemas/CsrfOnlyForm"
      responses:
        "200":
          description: Canceled (JSON caller)
          content:
            application/json:
              schema:
                type: object
                properties:
                  canceled:
                    type: boolean
                required: [canceled]
        "303":
          description: Redirect to the waiting page (HTML form caller)
        "400":
          description: No pending-request cookie, or a malformed body
          $ref: "#/components/responses/Error"
        "403":
          description: Bad Origin, or invalid CSRF token
          $ref: "#/components/responses/Error"
        "409":
          description: The request is no longer in a cancelable state
          $ref: "#/components/responses/Error"

  /__approve-auth/claim:
    post:
      operationId: claimCredential
      summary: Claim the access credential for an approved request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CsrfOnlyForm"
          application/json:
            schema:
              $ref: "#/components/schemas/CsrfOnlyForm"
      responses:
        "200":
          description: Sets the access cookie; JSON body carries a safe relative return path (JSON caller)
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "303":
          description: >
            Sets the access cookie; redirect to the waiting page (HTML
            form caller) -- not straight to return_to, per spec section
            5 step 7's no-JS path.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          description: No pending-request cookie, or a malformed body
          $ref: "#/components/responses/Error"
        "401":
          description: The claim window has passed and the retry envelope is gone -- request access again
          $ref: "#/components/responses/Error"
        "403":
          description: Bad Origin, or invalid CSRF token
          $ref: "#/components/responses/Error"
        "409":
          description: The request is not in a claimable state
          $ref: "#/components/responses/Error"

  /__approve-auth/session:
    get:
      operationId: getSession
      summary: Current access-cookie state and authorization expiry
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                required: [active]
        "400":
          description: Duplicate access cookie
          $ref: "#/components/responses/Error"
        "401":
          description: No active session
          $ref: "#/components/responses/Error"
        "503":
          description: Decision temporarily unavailable (fail closed)
          $ref: "#/components/responses/Error"

  /__approve-auth/ack:
    post:
      operationId: acknowledgeClaim
      summary: Acknowledge a claimed credential and consume the pending proof
      responses:
        "200":
          description: JSON body carries the validated return path (JSON caller)
          content:
            application/json:
              schema:
                type: object
                properties:
                  return_to:
                    type: string
                required: [return_to]
        "303":
          description: Redirect to the validated return path (HTML form caller)
          headers:
            Location:
              schema:
                type: string
        "400":
          description: No pending-request cookie
          $ref: "#/components/responses/Error"
        "401":
          description: No active access cookie to acknowledge
          $ref: "#/components/responses/Error"
        "403":
          description: Bad Origin
          $ref: "#/components/responses/Error"

  /__approve-auth/logout:
    post:
      operationId: logout
      summary: Revoke the caller's own authorization and clear its cookies
      responses:
        "200":
          description: OK -- always succeeds even if there was no active session to log out of
          content:
            application/json:
              schema:
                type: object
                properties:
                  logged_out:
                    type: boolean
                required: [logged_out]
        "403":
          description: Bad Origin
          $ref: "#/components/responses/Error"

  /__approve-auth/assets/{file}:
    get:
      operationId: getAsset
      summary: Locally bundled public-page assets only
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Static asset
        "404":
          description: Not found

components:
  schemas:
    SubmitRequestForm:
      type: object
      properties:
        label:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 500
        return_to:
          type: string
          maxLength: 2048
          description: Origin-relative path only; invalid input falls back to "/" (spec section 5)
        csrf_token:
          type: string
      required: [csrf_token]
      additionalProperties: false

    CsrfOnlyForm:
      type: object
      properties:
        csrf_token:
          type: string
      required: [csrf_token]
      additionalProperties: false

    SubmitRequestResult:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        verification_code:
          type: string
      required: [request_id, verification_code]
      additionalProperties: false

    StatusResult:
      type: object
      properties:
        state:
          type: string
          enum: [not_requested, pending, approved, denied, canceled, timed_out, claimed, claim_expired]
        verification_code:
          type: string
        public_message:
          type: string
        requested_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        claim_deadline_at:
          type: [string, "null"]
          format: date-time
        server_time:
          type: string
          format: date-time
        csrf_token:
          type: string
          description: Present only while the pending proof's enrollment context is still live
      required: [state, server_time]
      additionalProperties: false

    ClaimResult:
      type: object
      properties:
        return_to:
          type: string
      required: [return_to]
      additionalProperties: false

    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
          required: [code, message, request_id]
      required: [error]

  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
